name: Update gh-ascii Card
on:
  schedule:
    - cron: '0 0 * * *' # Runs every night at 00:00 UTC
  workflow_dispatch: # Enables manual trigger from the Actions tab

permissions:
  contents: write

# Prevents multiple manual/scheduled runs from running at the same time
concurrency:
  group: update-gh-ascii
  cancel-in-progress: true

jobs:
  update-card:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest SVGs
        run: |
          curl -fL "https://gh-ascii.vercel.app/${{ github.repository_owner }}?theme=dark" -o dark_mode.svg
          curl -fL "https://gh-ascii.vercel.app/${{ github.repository_owner }}?theme=light" -o light_mode.svg

      - name: Commit and push updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 1. Fetch the latest remote changes
          git fetch origin main
          
          # 2. Point local HEAD to remote main without discarding your downloaded SVGs
          git reset --soft origin/main
          
          # 3. Stage and check for actual file changes
          git add dark_mode.svg light_mode.svg
          
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-update gh-ascii stats"
            git push origin main
          fi
