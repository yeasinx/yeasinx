name: Update gh-ascii Card
on:
  schedule:
    - cron: '0 0 * * *' # Runs every night at 00:00 UTC
  workflow_dispatch: # Enables manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  update-card:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download latest SVGs
        run: |
          curl -fL "https://gh-ascii.vercel.app/${{ github.repository_owner }}?theme=dark" -o dark_mode.svg
          curl -fL "https://gh-ascii.vercel.app/${{ github.repository_owner }}?theme=light" -o light_mode.svg

      - name: Commit and push updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-update gh-ascii stats"
            git pull --rebase origin ${{ github.ref_name }}
            git push
          fi
